name: Witchly Auto Earn

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/witchly
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - name: Setup proxy
        id: proxy
        uses: alphaxcv/proxy_sb@1.0
        with:
          node_link: ${{ secrets.VLESS_LINK }}
          SINGBOX_VERSION: '1.13.21'

      - run: bash run.sh
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
          MAX_ADS: "20"
          MAX_FAILS: "3"
          ROUND_COOL_MIN: "2"
          ROUND_COOL_MAX: "4"
          BYPASS_COOL: "10"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

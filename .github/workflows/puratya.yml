name: puratya extend

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: seav1/puratya
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        timeout-minutes: 8
        run: |
          # 只装缺的包；不先 update，失败再 update 重试一次；每次 apt 最多 3 分钟，防卡死
          need=""
          command -v xvfb-run >/dev/null || need="$need xvfb"
          command -v xdotool  >/dev/null || need="$need xdotool"
          command -v scrot    >/dev/null || need="$need scrot"
          command -v xdpyinfo >/dev/null || need="$need x11-utils"
          if [ -n "$need" ]; then
            sudo timeout 180 apt-get install -y --no-install-recommends $need \
              || { sudo timeout 180 apt-get update && sudo timeout 180 apt-get install -y --no-install-recommends $need; }
          fi
          pip install --disable-pip-version-check seleniumbase

      - name: Set up WARP
        uses: alphaxcv/warp@1.0
        continue-on-error: true
        timeout-minutes: 3

      - name: Run
        timeout-minutes: 10
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

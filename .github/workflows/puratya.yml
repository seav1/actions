name: puratya extend

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: seav1/puratya
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 🛠️ 安装依赖
        timeout-minutes: 8
        run: |
          need=""
          command -v xvfb-run >/dev/null || need="$need xvfb"
          command -v xdotool  >/dev/null || need="$need xdotool"
          if [ -n "$need" ]; then
            sudo apt-get install -y --no-install-recommends $need \
              || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $need; }
          fi
          pip install -r requirements.txt

      - name: Set up WARP
        uses: alphaxcv/warp@1.0
        continue-on-error: true
        timeout-minutes: 3

      - name: Run
        timeout-minutes: 10
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          xvfb-run --auto-servernum python3 main.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

name: streamlit auto start

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/str
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - run: bash run.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-debug-screenshots
          path: "*.png"

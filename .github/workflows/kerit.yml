name: Kerit Cloud Auto Renew

on:
  schedule:
    - cron: "23 1 */3 * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/kerit
          token: ${{ secrets.REPO_PAT }}
          ref: main
          
      - uses: alphaxcv/warp@1.0
          
      - run: bash run.sh
        env:
          KERIT_EMAIL: ${{ secrets.KERIT_EMAIL }}
          KERIT_PASS: ${{ secrets.KERIT_PASS }}
          REPO_PAT: ${{ secrets.REPO_PAT }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kerit-debug-screenshots
          path: "*.png"

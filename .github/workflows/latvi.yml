name: Run

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: seav1/latvi
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libgbm1 libasound2t64 libatk-bridge2.0-0 \
            libgtk-3-0 libx11-xcb1 libxcomposite1 libxdamage1 \
            libxrandr2 libcups2 fonts-liberation

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install seleniumbase requests packaging urllib3

      - name: Set up WARP
        uses: alphaxcv/warp@1.0
        continue-on-error: true

      - name: Run
        env:
          LATVI_USERNAME: ${{ secrets.LATVI_USERNAME }}
          LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD }}
          MAX_ADS: "20"
          MAX_FAILS: "3"
          ROUND_COOL_MIN: "2"
          ROUND_COOL_MAX: "4"
          BYPASS_COOL: "90"
        run: xvfb-run -a python main.py

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

name: Latvi Auto Earn

on:
  schedule:
    - cron: '13 18 * * *'
  workflow_dispatch:
  
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/latvi
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - uses: alphaxcv/warp@1.0
        continue-on-error: true

      - run: bash run.sh
        env:
          LATVI_EMAIL: ${{ secrets.LATVI_EMAIL }}
          LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD }}
          MAX_ADS: "20"
          MAX_FAILS: "3"
          ROUND_COOL_MIN: "2"
          ROUND_COOL_MAX: "4"
          BYPASS_COOL: "90"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

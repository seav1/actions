name: Linkvertise Auto Earn

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/ateex
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - uses: alphaxcv/warp@1.0

      - run: bash run.sh
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
          MAX_ADS: "20"
          MAX_FAILS: "3"
          ROUND_COOL_MIN: "2"
          ROUND_COOL_MAX: "4"
          BYPASS_COOL: "90"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-screenshot
          path: "*.png"

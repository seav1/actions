name: Ateex Auto Earn

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/ateex
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - uses: alphaxcv/warp@1.0
        continue-on-error: true

      - run: bash run.sh
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MAX_ADS: "20"
          MAX_FAILS: "3"
          ROUND_COOL_MIN: "2"
          ROUND_COOL_MAX: "4"
          BYPASS_COOL: "10"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore

name: Discord Token Extractor

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'

jobs:
  run-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: Setup proxy
        id: proxy
        uses: alphaxcv/proxy_sb@1.0
        with:
          node_link: ${{ secrets.NODE_LINK }}

      - name: Run Discord Token Extractor
        env:
          DISCORD_EMAIL: ${{ secrets.DISCORD_EMAIL }}
          DISCORD_PASSWORD: ${{ secrets.DISCORD_PASSWORD }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
          PROXY_SERVER: 'socks5://127.0.0.1:1080'
        run: python discord_login.py

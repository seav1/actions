name: Teoheberg Auto Earn

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seav1/teoheberg
          token: ${{ secrets.REPO_PAT }}
          ref: main

      - uses: alphaxcv/warp@1.0
        continue-on-error: true

      - run: bash run.sh
        env:
          TEO_EMAIL: ${{ secrets.TEO_EMAIL }}
          TEO_PASSWORD: ${{ secrets.TEO_PASSWORD }}
          MAX_ADS: "3"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-output
          path: |
            *.png
            *.log
          if-no-files-found: ignore
